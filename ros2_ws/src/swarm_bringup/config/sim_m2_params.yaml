# sim_m2_params.yaml
# Read by sim_m2.launch.py to compute the 5x5 staggered hex grid sensor positions.
# Individual sensor ROS parameters are generated dynamically in the launch file.

swarm:
  grid_size: 5
  node_spacing: 12.0        # units; = 8 x detection_radius (paper §3.1)
  detection_radius: 1.5     # r_d
  communication_range: 18.0 # r_c — declared here for reference, used from M4 onward
  num_targets: 3
  dt: 0.1

target_simulator:
  ros__parameters:
    num_targets: 3
    dt: 0.1